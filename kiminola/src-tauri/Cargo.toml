[package]
name = "kiminola"
version = "0.1.4"
description = "Kiminola — local-first meeting transcription and AI-enhanced notes"
authors = ["Kiminola contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kiminola_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "json"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
png = "0.17"
cpal = "0.15"
rubato = "0.16"
# Native ONNX Runtime DLLs are supplied by scripts/prepare-native-deps.ps1.
# Disable ort's automatic download/copy behavior so ort-sys and sherpa-onnx-sys
# do not race while copying the same Windows runtime DLLs into Cargo output.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "api-27"] }
ndarray = "0.17"
# Shared linking against the prebuilt sherpa-onnx C API (see .cargo/config.toml
# SHERPA_ONNX_LIB_DIR); the default `static` feature expects static libs the
# Windows shared distribution does not ship.
sherpa-onnx = { version = "1.13.5", default-features = false, features = ["shared"] }
windows = { version = "0.58", features = [
    "implement",
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
] }
windows-core = "0.58"
