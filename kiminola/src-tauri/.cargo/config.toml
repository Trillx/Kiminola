# ring (pulled in by tauri-plugin-updater) needs clang to compile on
# aarch64-pc-windows-msvc; bindgen (sherpa-onnx FFI, wave 2) needs libclang.
# Both live in the winget-installed LLVM, which is not on PATH by default.
[env]
CC_aarch64-pc-windows-msvc = { value = "C:\\Program Files\\LLVM\\bin\\clang-cl.exe", force = false }
CXX_aarch64-pc-windows-msvc = { value = "C:\\Program Files\\LLVM\\bin\\clang-cl.exe", force = false }
LIBCLANG_PATH = { value = "C:\\Program Files\\LLVM\\bin", force = false }
# SHERPA_ONNX_LIB_DIR is supplied by scripts/prepare-native-deps.ps1 so clean
# checkouts and both Windows architectures use the matching native package.
