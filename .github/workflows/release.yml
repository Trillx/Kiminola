name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Repository configuration selects the release trust gates. Without SignPath,
# installers carry only the Tauri updater signature; without registered
# hardware runners, the physical x64/ARM64 gate is skipped with a warning.
# Preflight rejects a partial SignPath configuration so a missing value cannot
# silently downgrade a release to unsigned.
env:
  RELEASE_AUTHENTICODE: ${{ vars.SIGNPATH_SIGNER_THUMBPRINT != '' && 'signpath' || 'none' }}
  RELEASE_HARDWARE_GATE: ${{ vars.KIMINOLA_HARDWARE_CI == 'true' && 'required' || 'skipped' }}

jobs:
  preflight:
    name: Release preflight
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require release tag commit on main
        shell: pwsh
        run: |
          git show-ref --verify refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The protected origin/main ref is unavailable.' }
          $tagCommit = (git rev-parse "$env:GITHUB_SHA`^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit)) {
            throw 'The release tag does not resolve to a commit.'
          }
          git merge-base --is-ancestor $tagCommit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag commit '$tagCommit' is not reachable from protected main."
          }

      - name: Verify tag matches all app versions
        shell: pwsh
        working-directory: kiminola
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $config = Get-Content -Raw 'src-tauri/tauri.conf.json' | ConvertFrom-Json
          $package = Get-Content -Raw 'package.json' | ConvertFrom-Json
          $cargoVersion = [regex]::Match((Get-Content -Raw 'src-tauri/Cargo.toml'), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $versions = @($config.version, $package.version, $cargoVersion)
          if (($versions | Select-Object -Unique).Count -ne 1) {
            throw "App versions are not synchronized: $($versions -join ', ')."
          }
          $expectedTag = "v$($config.version)"
          if ($expectedTag -ne $env:RELEASE_TAG) {
            throw "Release tag '$env:RELEASE_TAG' does not match app version '$($config.version)'."
          }

      - name: Verify release signing configuration before draft creation
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_SIGNER_THUMBPRINT: ${{ vars.SIGNPATH_SIGNER_THUMBPRINT }}
        run: |
          # Windows removes empty environment variables, so read them without Get-Item.
          foreach ($name in @('TAURI_SIGNING_PRIVATE_KEY', 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name is not configured for this repository."
            }
          }
          $signPathNames = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG',
            'SIGNPATH_SIGNER_THUMBPRINT'
          )
          $configured = @($signPathNames | Where-Object {
            -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($env:RELEASE_AUTHENTICODE -eq 'signpath') {
            foreach ($name in $signPathNames) {
              if ($configured -notcontains $name) {
                throw "$name is not configured for this repository."
              }
            }
            if ($env:SIGNPATH_SIGNER_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
              throw 'SIGNPATH_SIGNER_THUMBPRINT must be the 40-character SHA-1 thumbprint of the approved SignPath certificate.'
            }
          } elseif ($env:RELEASE_AUTHENTICODE -eq 'none') {
            if ($configured.Count -gt 0) {
              throw "SignPath is partially configured ($($configured -join ', ')). Configure every SignPath secret and variable, or none of them."
            }
            Write-Host '::warning title=Release without Authenticode::SignPath is not configured. Installers and portable executables will carry only the Tauri updater signature.'
          } else {
            throw "Unknown release Authenticode mode '$env:RELEASE_AUTHENTICODE'."
          }
          if ($env:RELEASE_HARDWARE_GATE -ne 'required') {
            Write-Host '::warning title=Hardware gate skipped::KIMINOLA_HARDWARE_CI is not true. This release has no physical x64/ARM64 validation.'
          }

      - name: Test release support scripts
        working-directory: kiminola
        shell: pwsh
        run: |
          ./scripts/generate-updater-manifest.test.ps1
          ./scripts/verify-pe-architecture.test.ps1
          ./scripts/stage-portable-package.test.ps1
          ./scripts/hardware-runner-state.test.ps1

  security-gate:
    name: Release dependency security gate
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiminola/package-lock.json

      - name: Audit locked production npm dependencies
        working-directory: kiminola
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm audit --omit=dev --audit-level=moderate

      - name: Audit locked Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: kiminola/src-tauri
          # SQLx's derive/migration macros retain the optional MySQL backend in
          # Cargo.lock, but it is not enabled or compiled by this SQLite-only app.
          ignore: RUSTSEC-2023-0071

  hardware-gate:
    name: Dispatch and verify release hardware gate
    needs: preflight
    runs-on: windows-2025
    timeout-minutes: 220
    permissions:
      contents: read
      actions: write
    steps:
      - name: Run hardware validation separately from SignPath provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_HARDWARE_GATE -ne 'required') {
            Write-Host '::warning title=Hardware gate skipped::KIMINOLA_HARDWARE_CI is not true, so no physical validation run was dispatched.'
            exit 0
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $marker ="release-$env:RELEASE_RUN_ID-$env:RELEASE_RUN_ATTEMPT"
          $expectedTitle = "Hardware validation $marker"
          $dispatchUri = "https://api.github.com/repos/$env:RELEASE_REPOSITORY/actions/workflows/hardware-validation.yml/dispatches"
          $dispatchBody = @{
            ref = $env:RELEASE_TAG
            inputs = @{ release_gate_id = $marker }
          } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Post -Uri $dispatchUri -Headers $headers -ContentType 'application/json' -Body $dispatchBody

          $runsUri = "https://api.github.com/repos/$env:RELEASE_REPOSITORY/actions/workflows/hardware-validation.yml/runs?event=workflow_dispatch&head_sha=$env:RELEASE_COMMIT&per_page=100"
          $run = $null
          $creationDeadline = [DateTime]::UtcNow.AddMinutes(5)
          while ($null -eq $run -and [DateTime]::UtcNow -lt $creationDeadline) {
            $runs = Invoke-RestMethod -Method Get -Uri $runsUri -Headers $headers
            $run = @($runs.workflow_runs | Where-Object {
              $_.head_sha -eq $env:RELEASE_COMMIT -and $_.display_title -eq $expectedTitle
            } | Sort-Object created_at -Descending | Select-Object -First 1)
            if ($run.Count -eq 0) {
              $run = $null
              Start-Sleep -Seconds 10
            } else {
              $run = $run[0]
            }
          }
          if ($null -eq $run) {
            throw "The separately dispatched hardware run '$expectedTitle' for $env:RELEASE_COMMIT did not appear."
          }

          Write-Host "Waiting for hardware validation run $($run.html_url)"
          $completionDeadline = [DateTime]::UtcNow.AddMinutes(210)
          do {
            $run = Invoke-RestMethod -Method Get -Uri $run.url -Headers $headers
            if ($run.status -eq 'completed') { break }
            if ([DateTime]::UtcNow -ge $completionDeadline) {
              throw "Hardware validation run $($run.html_url) did not complete before the release gate timed out."
            }
            Start-Sleep -Seconds 20
          } while ($true)
          if ($run.conclusion -ne 'success' -or $run.head_sha -ne $env:RELEASE_COMMIT) {
            throw "Hardware validation failed for the exact release commit: status=$($run.status), conclusion=$($run.conclusion), sha=$($run.head_sha), url=$($run.html_url)."
          }

  create-release:
    name: Create draft release
    needs:
      - preflight
      - hardware-gate
      - security-gate
    runs-on: windows-2025
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or reuse the draft release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releaseUri = "https://api.github.com/repos/$env:RELEASE_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          $release = $null
          try {
            $release = Invoke-RestMethod -Method Get -Uri $releaseUri -Headers $headers
          } catch {
            $status = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            if ($status -ne 404) { throw }
          }

          if ($null -eq $release) {
            $notes = @("Windows x64 and ARM64 installers for Kimi Nola $env:RELEASE_TAG.")
            if ($env:RELEASE_AUTHENTICODE -ne 'signpath') {
              $notes += 'These builds are not Authenticode-signed, so Windows SmartScreen may warn before the first run. Installers carry the Tauri updater signature.'
            }
            if ($env:RELEASE_HARDWARE_GATE -ne 'required') {
              $notes += 'Physical x64/ARM64 hardware validation did not run for this release.'
            }
            $body = @{
              tag_name = $env:RELEASE_TAG
              target_commitish = $env:RELEASE_COMMIT
              name = "Kimi Nola $env:RELEASE_TAG"
              body = $notes -join "`n`n"
              draft = $true
              prerelease = $false
            } | ConvertTo-Json
            $createUri = "https://api.github.com/repos/$env:RELEASE_REPOSITORY/releases"
            $release = Invoke-RestMethod -Method Post -Uri $createUri -Headers $headers -ContentType 'application/json' -Body $body
          }

          if ($release.tag_name -ne $env:RELEASE_TAG) {
            throw "GitHub returned release tag '$($release.tag_name)' for '$env:RELEASE_TAG'."
          }
          if (-not $release.draft -or $release.prerelease) {
            throw "Release '$env:RELEASE_TAG' must remain a draft and must not be a prerelease while assets are being validated."
          }
          "release_id=$($release.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  windows-release:
    name: Build Windows ${{ matrix.arch }} release
    needs: create-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is not configured for this repository.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured for this repository.'
          }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiminola/package-lock.json

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: kiminola/src-tauri
          shared-key: release-${{ matrix.target }}

      - name: Configure native hosted LLVM
        shell: pwsh
        run: |
          $llvmBin = 'C:\Program Files\LLVM\bin'
          $llvmPaths = @("$llvmBin\clang.exe", "$llvmBin\libclang.dll")
          ./kiminola/scripts/verify-pe-architecture.ps1 -Target '${{ matrix.target }}' -Paths $llvmPaths
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install frontend dependencies
        working-directory: kiminola
        run: npm.cmd ci --include=dev --no-audit --no-fund

      - name: Prepare native dependencies
        working-directory: kiminola
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-native-deps.ps1 -Target '${{ matrix.target }}' -WriteGithubEnv

      - name: Run all-target Rust tests natively
        working-directory: kiminola/src-tauri
        run: cargo test --locked --all-targets --target '${{ matrix.target }}'

      - name: Run Rust documentation tests natively
        working-directory: kiminola/src-tauri
        run: cargo test --locked --doc --target '${{ matrix.target }}'

      - name: Build release executable before packaging
        working-directory: kiminola
        run: |
          npm.cmd run tauri build -- `
            --target '${{ matrix.target }}' `
            --no-bundle

      - name: Verify executable and bundled DLL architecture
        working-directory: kiminola
        shell: pwsh
        run: |
          $paths = @(
            'src-tauri/target/${{ matrix.target }}/release/kiminola.exe',
            'src-tauri/target/release/onnxruntime.dll',
            'src-tauri/target/release/onnxruntime_providers_shared.dll',
            'src-tauri/target/release/sherpa-onnx-c-api.dll',
            'src-tauri/target/release/sherpa-onnx-cxx-api.dll'
          )
          ./scripts/verify-pe-architecture.ps1 -Target '${{ matrix.target }}' -Paths $paths

      - name: Upload release executable for SignPath
        if: env.RELEASE_AUTHENTICODE == 'signpath'
        id: upload-unsigned-executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signpath-executable-${{ matrix.arch }}-${{ github.run_id }}
          path: kiminola/src-tauri/target/${{ matrix.target }}/release/kiminola.exe
          if-no-files-found: error
          retention-days: 1

      - name: Authenticode-sign release executable with SignPath
        if: env.RELEASE_AUTHENTICODE == 'signpath'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-executable.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signed-executable
          skip-decompress: false

      - name: Replace and verify the Authenticode-signed release executable
        if: env.RELEASE_AUTHENTICODE == 'signpath'
        working-directory: kiminola
        shell: pwsh
        env:
          EXPECTED_SIGNER_THUMBPRINT: ${{ vars.SIGNPATH_SIGNER_THUMBPRINT }}
        run: |
          $signed = @(Get-ChildItem -LiteralPath '${{ runner.temp }}/signed-executable' -Filter 'kiminola.exe' -File -Recurse)
          if ($signed.Count -ne 1) { throw "Expected one SignPath-signed executable, found $($signed.Count)." }
          $executable = 'src-tauri/target/${{ matrix.target }}/release/kiminola.exe'
          Copy-Item -LiteralPath $signed[0].FullName -Destination $executable -Force
          $signature = Get-AuthenticodeSignature -FilePath $executable
          $expectedSignerThumbprint = $env:EXPECTED_SIGNER_THUMBPRINT.Trim().ToUpperInvariant()
          if ($signature.Status -ne 'Valid' -or
              $null -eq $signature.SignerCertificate -or
              $null -eq $signature.TimeStamperCertificate -or
              $signature.SignerCertificate.Thumbprint.Trim().ToUpperInvariant() -ne $expectedSignerThumbprint) {
            throw "Authenticode verification failed for '$executable': $($signature.StatusMessage)"
          }

      - name: Test release executable startup behavior
        working-directory: kiminola
        shell: pwsh
        run: ./scripts/startup-behavior.test.ps1 -Executable 'src-tauri/target/${{ matrix.target }}/release/kiminola.exe' -TimeoutSeconds 30

      - name: Stage complete portable package
        working-directory: kiminola
        shell: pwsh
        run: |
          $config = Get-Content -Raw 'src-tauri/tauri.conf.json' | ConvertFrom-Json
          ./scripts/stage-portable-package.ps1 `
            -Executable 'src-tauri/target/${{ matrix.target }}/release/kiminola.exe' `
            -NativeDirectory 'src-tauri/target/release' `
            -OutputPath "portable/Kimi-Nola_$($config.version)_${{ matrix.arch }}-portable.zip"

      - name: Bundle the verified executable and create initial updater signature
        working-directory: kiminola
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm.cmd run tauri bundle -- --target '${{ matrix.target }}'

      - name: Upload installer for SignPath
        if: env.RELEASE_AUTHENTICODE == 'signpath'
        id: upload-unsigned-installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signpath-installer-${{ matrix.arch }}-${{ github.run_id }}
          path: kiminola/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Authenticode-sign installer with SignPath
        if: env.RELEASE_AUTHENTICODE == 'signpath'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signed-installer
          skip-decompress: false

      - name: Replace installer, verify Authenticode, and regenerate updater signature
        working-directory: kiminola
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          EXPECTED_SIGNER_THUMBPRINT: ${{ vars.SIGNPATH_SIGNER_THUMBPRINT }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/${{ matrix.target }}/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one local installer, found $($installers.Count)." }
          $installer = $installers[0]
          if ($env:RELEASE_AUTHENTICODE -eq 'signpath') {
            $signed = @(Get-ChildItem -LiteralPath '${{ runner.temp }}/signed-installer' -Filter '*-setup.exe' -File -Recurse)
            if ($signed.Count -ne 1) { throw "Expected one SignPath-signed installer, found $($signed.Count)." }
            Copy-Item -LiteralPath $signed[0].FullName -Destination $installer.FullName -Force
            $authenticode = Get-AuthenticodeSignature -FilePath $installer.FullName
            $expectedSignerThumbprint = $env:EXPECTED_SIGNER_THUMBPRINT.Trim().ToUpperInvariant()
            if ($authenticode.Status -ne 'Valid' -or
                $null -eq $authenticode.SignerCertificate -or
                $null -eq $authenticode.TimeStamperCertificate -or
                $authenticode.SignerCertificate.Thumbprint.Trim().ToUpperInvariant() -ne $expectedSignerThumbprint) {
              throw "Authenticode verification failed for '$($installer.Name)': $($authenticode.StatusMessage)"
            }
          } elseif ((Get-AuthenticodeSignature -FilePath $installer.FullName).Status -ne 'NotSigned') {
            throw "Installer '$($installer.Name)' unexpectedly carries an Authenticode signature in an unsigned release."
          }

          $initialSignaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $initialSignaturePath -PathType Leaf)) {
            throw "The initial updater signature is missing for '$($installer.Name)'."
          }
          Remove-Item -LiteralPath $initialSignaturePath -Force

          $version = '${{ github.ref_name }}'.Substring(1)
          $arch = '${{ matrix.arch }}'.ToLowerInvariant()
          $canonicalInstallerName = "Kimi.Nola_${version}_${arch}-setup.exe"
          $canonicalInstallerPath = Join-Path $installer.DirectoryName $canonicalInstallerName
          if (-not [string]::Equals($installer.FullName, $canonicalInstallerPath, [StringComparison]::OrdinalIgnoreCase)) {
            if (Test-Path -LiteralPath $canonicalInstallerPath) {
              throw "Canonical installer path already exists: '$canonicalInstallerPath'."
            }
            Move-Item -LiteralPath $installer.FullName -Destination $canonicalInstallerPath
            $installer = Get-Item -LiteralPath $canonicalInstallerPath
          }

          $signaturePath = "$($installer.FullName).sig"
          Remove-Item -LiteralPath $signaturePath -Force -ErrorAction SilentlyContinue
          npm.cmd run tauri -- signer sign $installer.FullName
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
            throw "Regenerating the updater signature failed for '$($installer.Name)'."
          }
          $remainingSignatures = @(Get-ChildItem -LiteralPath $installer.DirectoryName -Filter '*.exe.sig' -File)
          if ($remainingSignatures.Count -ne 1 -or
              -not [string]::Equals($remainingSignatures[0].FullName, $signaturePath, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Expected exactly one canonical updater signature '$signaturePath'; found $($remainingSignatures.Name -join ', ')."
          }

      - name: Record the exact verified release assets
        working-directory: kiminola
        shell: pwsh
        env:
          EXPECTED_SIGNER_THUMBPRINT: ${{ vars.SIGNPATH_SIGNER_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/${{ matrix.target }}/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)." }
          $installer = $installers[0]
          $signaturePath = "$($installer.FullName).sig"
          $signatures = @(Get-ChildItem -LiteralPath $installer.DirectoryName -Filter '*.exe.sig' -File)
          if ($signatures.Count -ne 1 -or
              -not [string]::Equals($signatures[0].FullName, $signaturePath, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Expected exactly one canonical updater signature '$signaturePath'; found $($signatures.Name -join ', ')."
          }
          $signedRelease = $env:RELEASE_AUTHENTICODE -eq 'signpath'
          $authenticode = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signedRelease) {
            $expectedSignerThumbprint = $env:EXPECTED_SIGNER_THUMBPRINT.Trim().ToUpperInvariant()
            if ($authenticode.Status -ne 'Valid' -or
                $null -eq $authenticode.SignerCertificate -or
                $null -eq $authenticode.TimeStamperCertificate -or
                $authenticode.SignerCertificate.Thumbprint.Trim().ToUpperInvariant() -ne $expectedSignerThumbprint) {
              throw "Authenticode verification failed for '$($installer.Name)': $($authenticode.StatusMessage)"
            }
          } elseif ($authenticode.Status -ne 'NotSigned') {
            throw "Installer '$($installer.Name)' unexpectedly carries an Authenticode signature in an unsigned release."
          }
          $portable = @(Get-ChildItem -LiteralPath 'portable' -Filter 'Kimi-Nola_*_${{ matrix.arch }}-portable.zip' -File)
          if ($portable.Count -ne 1) { throw "Expected one portable archive, found $($portable.Count)." }
          $portableExecutable = 'src-tauri/target/${{ matrix.target }}/release/kiminola.exe'
          $portableAuthenticode = Get-AuthenticodeSignature -FilePath $portableExecutable
          if ($signedRelease) {
            if ($portableAuthenticode.Status -ne 'Valid' -or
                $null -eq $portableAuthenticode.SignerCertificate -or
                $null -eq $portableAuthenticode.TimeStamperCertificate -or
                $portableAuthenticode.SignerCertificate.Thumbprint.Trim().ToUpperInvariant() -ne $expectedSignerThumbprint) {
              throw "Authenticode verification failed for portable executable '$portableExecutable': $($portableAuthenticode.StatusMessage)"
            }
          } elseif ($portableAuthenticode.Status -ne 'NotSigned') {
            throw "Portable executable '$portableExecutable' unexpectedly carries an Authenticode signature in an unsigned release."
          }

          $reportPath = Join-Path 'portable' 'release-verification-${{ matrix.arch }}.json'
          $report = [ordered]@{
            architecture = '${{ matrix.arch }}'.ToLowerInvariant()
            target = '${{ matrix.target }}'
            authenticode = $env:RELEASE_AUTHENTICODE
            installer = [ordered]@{
              name = $installer.Name
              sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              authenticode_status = $authenticode.Status.ToString()
              signer_thumbprint = if ($signedRelease) { $authenticode.SignerCertificate.Thumbprint.ToLowerInvariant() } else { $null }
            }
            signature = [ordered]@{
              name = [IO.Path]::GetFileName($signaturePath)
              sha256 = (Get-FileHash -LiteralPath $signaturePath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            portable = [ordered]@{
              name = $portable[0].Name
              sha256 = (Get-FileHash -LiteralPath $portable[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              executable_sha256 = (Get-FileHash -LiteralPath $portableExecutable -Algorithm SHA256).Hash.ToLowerInvariant()
              authenticode_status = $portableAuthenticode.Status.ToString()
              signer_thumbprint = if ($signedRelease) { $portableAuthenticode.SignerCertificate.Thumbprint.ToLowerInvariant() } else { $null }
            }
          }
          [IO.File]::WriteAllText($reportPath, ($report | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))

      - name: Upload verified release assets for the publishing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            kiminola/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            kiminola/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig
            kiminola/portable/Kimi-Nola_*_${{ matrix.arch }}-portable.zip
            kiminola/portable/release-verification-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 1

  publish-assets:
    name: Publish verified architecture assets
    needs:
      - create-release
      - windows-release
    runs-on: windows-2025
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified architecture artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-assets-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets

      - name: Upload only the verified architecture assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assetDirectory = '${{ runner.temp }}/release-assets'
          $assetRules = [ordered]@{
            '*-setup.exe' = 2
            '*.exe.sig' = 2
            '*-portable.zip' = 2
            'release-verification-*.json' = 2
          }
          $assets = @()
          foreach ($rule in $assetRules.GetEnumerator()) {
            $matches = @(Get-ChildItem -LiteralPath $assetDirectory -Filter $rule.Key -File -Recurse)
            if ($matches.Count -ne $rule.Value) {
              throw "Expected $($rule.Value) '$($rule.Key)' artifacts, found $($matches.Count)."
            }
            $assets += $matches
          }
          foreach ($asset in $assets) {
            gh release upload $env:RELEASE_TAG $asset.FullName --clobber --repo $env:RELEASE_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Uploading '$($asset.FullName)' failed." }
          }

          # Draft releases are invisible to read-only tokens, so read the
          # uploaded draft assets back here and hand those exact bytes to the
          # read-only verification job.
          $readbackDirectory = '${{ runner.temp }}/release-readback'
          New-Item -ItemType Directory -Path $readbackDirectory -Force | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:RELEASE_REPOSITORY `
            --dir $readbackDirectory `
            --pattern '*-setup.exe' `
            --pattern '*.exe.sig' `
            --pattern '*-portable.zip' `
            --pattern 'release-verification-*.json'
          if ($LASTEXITCODE -ne 0) { throw 'Reading back the draft release assets failed.' }
          gh api "repos/$env:RELEASE_REPOSITORY/releases/$env:RELEASE_ID" > "$readbackDirectory/release.json"
          if ($LASTEXITCODE -ne 0) { throw 'Reading back the draft release metadata failed.' }

      - name: Hand the draft readback to the verification job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/release-readback
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Verify assets and generate updater manifest
    needs:
      - create-release
      - publish-assets
    if: ${{ needs.publish-assets.result == 'success' }}
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the draft release readback
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/release-assets

      - name: Verify exact assets, signatures, and latest.json
        shell: pwsh
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          EXPECTED_SIGNER_THUMBPRINT: ${{ vars.SIGNPATH_SIGNER_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content -Raw 'kiminola/src-tauri/tauri.conf.json' | ConvertFrom-Json
          $downloadDirectory = Join-Path $env:RUNNER_TEMP 'release-assets'

          $assetRules = [ordered]@{
            '*-setup.exe' = 2
            '*.exe.sig' = 2
            '*-portable.zip' = 2
            'release-verification-*.json' = 2
          }
          foreach ($rule in $assetRules.GetEnumerator()) {
            $actualCount = @(Get-ChildItem -LiteralPath $downloadDirectory -Filter $rule.Key -File).Count
            if ($actualCount -ne $rule.Value) {
              throw "Expected $($rule.Value) '$($rule.Key)' assets, found $actualCount."
            }
          }

          $minisignArchive = Join-Path $env:RUNNER_TEMP 'minisign-0.12-win64.zip'
          Invoke-WebRequest `
            -Uri 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip' `
            -OutFile $minisignArchive
          $minisignHash = (Get-FileHash -LiteralPath $minisignArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($minisignHash -ne '37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479') {
            throw "Minisign archive hash mismatch: $minisignHash."
          }
          $minisignDirectory = Join-Path $env:RUNNER_TEMP 'minisign-0.12'
          Expand-Archive -LiteralPath $minisignArchive -DestinationPath $minisignDirectory -Force
          $minisign = Join-Path $minisignDirectory 'minisign-win64\x86_64\minisign.exe'
          if (-not (Test-Path -LiteralPath $minisign -PathType Leaf)) { throw "Missing $minisign." }
          $publicKeyPath = Join-Path $env:RUNNER_TEMP 'kiminola-minisign.pub'
          [IO.File]::WriteAllBytes($publicKeyPath, [Convert]::FromBase64String($config.plugins.updater.pubkey))

          $expected = [ordered]@{
            x64 = 'x86_64-pc-windows-msvc'
            arm64 = 'aarch64-pc-windows-msvc'
          }
          $reports = @{}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($architecture in $expected.Keys) {
            $reportPath = Join-Path $downloadDirectory "release-verification-$architecture.json"
            if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw "Missing $reportPath." }
            $report = Get-Content -Raw $reportPath | ConvertFrom-Json
            if ($report.architecture -ne $architecture -or $report.target -ne $expected[$architecture]) {
              throw "Release report '$architecture' has the wrong architecture or Rust target."
            }

            foreach ($kind in @('installer', 'signature', 'portable')) {
              $metadata = $report.$kind
              $assetPath = Join-Path $downloadDirectory $metadata.name
              if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
                throw "Release report '$architecture' references missing $kind '$($metadata.name)'."
              }
              $actualHash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -ne $metadata.sha256) {
                throw "Release $kind hash mismatch for '$($metadata.name)'."
              }
            }

            if ($report.installer.name -notmatch "_$architecture-setup\.exe$") {
              throw "Installer '$($report.installer.name)' does not identify $architecture."
            }
            if ($report.signature.name -ne "$($report.installer.name).sig") {
              throw "Signature '$($report.signature.name)' does not match '$($report.installer.name)'."
            }

            if ($report.authenticode -ne $env:RELEASE_AUTHENTICODE) {
              throw "Release report '$architecture' was built in Authenticode mode '$($report.authenticode)', expected '$env:RELEASE_AUTHENTICODE'."
            }
            $signedRelease = $env:RELEASE_AUTHENTICODE -eq 'signpath'
            $installerPath = Join-Path $downloadDirectory $report.installer.name
            $authenticode = Get-AuthenticodeSignature -FilePath $installerPath
            if ($signedRelease) {
              $expectedSignerThumbprint = $env:EXPECTED_SIGNER_THUMBPRINT.Trim().ToUpperInvariant()
              if ($report.installer.authenticode_status -ne 'Valid' -or
                  $authenticode.Status -ne 'Valid' -or
                  $null -eq $authenticode.SignerCertificate -or
                  $null -eq $authenticode.TimeStamperCertificate -or
                  $report.installer.signer_thumbprint -ne $expectedSignerThumbprint.ToLowerInvariant() -or
                  $authenticode.SignerCertificate.Thumbprint.ToLowerInvariant() -ne $report.installer.signer_thumbprint) {
                throw "Authenticode verification failed for downloaded installer '$($report.installer.name)'."
              }
            } elseif ($report.installer.authenticode_status -ne 'NotSigned' -or $authenticode.Status -ne 'NotSigned') {
              throw "Downloaded installer '$($report.installer.name)' does not match its unsigned release report."
            }
            $signaturePath = Join-Path $downloadDirectory $report.signature.name
            $rawSignaturePath = "$signaturePath.raw"
            [IO.File]::WriteAllBytes(
              $rawSignaturePath,
              [Convert]::FromBase64String((Get-Content -Raw $signaturePath).Trim())
            )
            & $minisign -V -q -p $publicKeyPath -m $installerPath -x $rawSignaturePath
            if ($LASTEXITCODE -ne 0) {
              throw "Updater signature verification failed for '$($report.installer.name)'."
            }

            $portablePath = Join-Path $downloadDirectory $report.portable.name
            $archive = [IO.Compression.ZipFile]::OpenRead($portablePath)
            try {
              $portableEntries = @($archive.Entries | ForEach-Object FullName | Sort-Object)
            } finally {
              $archive.Dispose()
            }
            $expectedEntries = @(
              'kiminola.exe',
              'onnxruntime.dll',
              'onnxruntime_providers_shared.dll',
              'sherpa-onnx-c-api.dll',
              'sherpa-onnx-cxx-api.dll'
            ) | Sort-Object
            if (Compare-Object -ReferenceObject $expectedEntries -DifferenceObject $portableEntries) {
              throw "Portable archive '$($report.portable.name)' is incomplete."
            }
            $portableExtract = Join-Path $env:RUNNER_TEMP "portable-$architecture"
            Expand-Archive -LiteralPath $portablePath -DestinationPath $portableExtract -Force
            $portablePePaths = @($expectedEntries | ForEach-Object { Join-Path $portableExtract $_ })
            & .\kiminola\scripts\verify-pe-architecture.ps1 `
              -Target $expected[$architecture] `
              -Paths $portablePePaths
            $portableExecutablePath = Join-Path $portableExtract 'kiminola.exe'
            $portableExecutableHash = (Get-FileHash -LiteralPath $portableExecutablePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $portableAuthenticode = Get-AuthenticodeSignature -FilePath $portableExecutablePath
            if ($portableExecutableHash -ne $report.portable.executable_sha256) {
              throw "Portable executable hash mismatch for '$($report.portable.name)'."
            }
            if ($signedRelease) {
              if ($report.portable.authenticode_status -ne 'Valid' -or
                  $portableAuthenticode.Status -ne 'Valid' -or
                  $null -eq $portableAuthenticode.SignerCertificate -or
                  $null -eq $portableAuthenticode.TimeStamperCertificate -or
                  $report.portable.signer_thumbprint -ne $expectedSignerThumbprint.ToLowerInvariant() -or
                  $portableAuthenticode.SignerCertificate.Thumbprint.ToLowerInvariant() -ne $report.portable.signer_thumbprint) {
                throw "Authenticode verification failed for downloaded portable executable '$($report.portable.name)'."
              }
            } elseif ($report.portable.authenticode_status -ne 'NotSigned' -or $portableAuthenticode.Status -ne 'NotSigned') {
              throw "Downloaded portable executable '$($report.portable.name)' does not match its unsigned release report."
            }
            $reports[$architecture] = $report
          }

          $outputPath = Join-Path $env:RUNNER_TEMP 'latest.json'
          # This job's read-only token cannot see the draft, so describe the
          # release from the publish job's readback, pointing each asset at
          # its verified local copy.
          $release = Get-Content -Raw (Join-Path $downloadDirectory 'release.json') | ConvertFrom-Json
          foreach ($asset in $release.assets) {
            $localPath = Join-Path $downloadDirectory $asset.name
            if (Test-Path -LiteralPath $localPath -PathType Leaf) {
              $asset | Add-Member -NotePropertyName local_path -NotePropertyValue $localPath
            }
          }
          $releaseDescriptionPath = Join-Path $env:RUNNER_TEMP 'release-description.json'
          [IO.File]::WriteAllText($releaseDescriptionPath, ($release | ConvertTo-Json -Depth 8), [Text.UTF8Encoding]::new($false))
          & .\kiminola\scripts\generate-updater-manifest.ps1 `
            -Repository $env:RELEASE_REPOSITORY `
            -Tag $env:RELEASE_TAG `
            -ReleaseId ([long]$env:RELEASE_ID) `
            -Version $config.version `
            -OutputPath $outputPath `
            -ReleaseFixturePath $releaseDescriptionPath

          $manifest = Get-Content -Raw $outputPath | ConvertFrom-Json
          $expectedPrefix = "https://github.com/$env:RELEASE_REPOSITORY/releases/download/$env:RELEASE_TAG/"
          $platformArchitectures = [ordered]@{
            'windows-x86_64' = 'x64'
            'windows-aarch64' = 'arm64'
            'windows-x86_64-nsis' = 'x64'
            'windows-aarch64-nsis' = 'arm64'
          }
          foreach ($platform in $platformArchitectures.Keys) {
            $architecture = $platformArchitectures[$platform]
            $entry = $manifest.platforms.PSObject.Properties[$platform].Value
            if ($null -eq $entry -or [string]::IsNullOrWhiteSpace($entry.url) -or [string]::IsNullOrWhiteSpace($entry.signature)) {
              throw "Updater manifest is missing a complete '$platform' entry."
            }
            if (-not $entry.url.StartsWith($expectedPrefix) -or $entry.url -match 'untagged') {
              throw "Updater manifest '$platform' URL is not permanent and tag-versioned: $($entry.url)"
            }
            if ($entry.signature -match '^https?://') {
              throw "Updater manifest '$platform' signature must be literal signature content."
            }
            $installerName = [IO.Path]::GetFileName(([uri]$entry.url).AbsolutePath)
            if ($installerName -ne $reports[$architecture].installer.name) {
              throw "Updater manifest '$platform' points at '$installerName' instead of the verified installer."
            }
            $signaturePath = Join-Path $downloadDirectory $reports[$architecture].signature.name
            if ($entry.signature -ne (Get-Content -Raw $signaturePath).Trim()) {
              throw "Updater manifest '$platform' does not contain the verified signature."
            }
          }

      - name: Upload verified updater manifest for the publishing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/latest.json
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish and read back the updater manifest
    needs:
      - create-release
      - publish-assets
      - manifest
    runs-on: windows-2025
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified updater manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/release-manifest

      - name: Publish manifest and verify the exact draft asset set
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path '${{ runner.temp }}/release-manifest' 'latest.json'
          gh release upload $env:RELEASE_TAG "$manifestPath#latest.json" --clobber --repo $env:RELEASE_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Uploading latest.json failed.' }

          $uploadedManifestDirectory = Join-Path $env:RUNNER_TEMP 'uploaded-manifest'
          New-Item -ItemType Directory -Path $uploadedManifestDirectory -Force | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:RELEASE_REPOSITORY `
            --dir $uploadedManifestDirectory `
            --pattern 'latest.json' `
            --pattern 'release-verification-*.json'
          if ($LASTEXITCODE -ne 0) { throw 'Downloading the published manifest and reports failed.' }
          $uploadedManifestPath = Join-Path $uploadedManifestDirectory 'latest.json'
          $generatedHash = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash
          $uploadedHash = (Get-FileHash -LiteralPath $uploadedManifestPath -Algorithm SHA256).Hash
          if ($uploadedHash -ne $generatedHash) {
            throw 'The uploaded latest.json differs from the verified generated manifest.'
          }
          $uploadedManifest = Get-Content -Raw $uploadedManifestPath | ConvertFrom-Json
          if ("v$($uploadedManifest.version)" -ne $env:RELEASE_TAG) {
            throw "The uploaded latest.json version '$($uploadedManifest.version)' does not match '$env:RELEASE_TAG'."
          }

          $release = gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if (-not $release.isDraft -or $release.isPrerelease) {
            throw 'The updater manifest must be published to a draft, non-prerelease release.'
          }
          $expectedAssetNames = @('latest.json')
          $reportFiles = @(Get-ChildItem -LiteralPath $uploadedManifestDirectory -Filter 'release-verification-*.json' -File)
          if ($reportFiles.Count -ne 2) { throw "Expected two release verification reports, found $($reportFiles.Count)." }
          foreach ($reportFile in $reportFiles) {
            $report = Get-Content -Raw -LiteralPath $reportFile.FullName | ConvertFrom-Json
            $expectedAssetNames += @(
              $report.installer.name,
              $report.signature.name,
              $report.portable.name,
              $reportFile.Name
            )
          }
          $actualAssetNames = @($release.assets | ForEach-Object name)
          if (Compare-Object -ReferenceObject ($expectedAssetNames | Sort-Object) -DifferenceObject ($actualAssetNames | Sort-Object)) {
            throw "The draft release asset set does not exactly match the verified files. Expected: $($expectedAssetNames -join ', '). Actual: $($actualAssetNames -join ', ')."
          }
