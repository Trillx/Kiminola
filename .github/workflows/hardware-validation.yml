name: Hardware validation

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      previous_tag:
        description: Previous published version to install before the candidate
        required: false
        type: string
  workflow_call:
    inputs:
      previous_tag:
        description: Previous published version to install before the candidate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hardware-validation
  cancel-in-progress: false

jobs:
  configuration:
    name: Resolve hardware validation configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      previous_tag: ${{ steps.release.outputs.previous_tag }}
    steps:
      - name: Require configured hardware runners and resolve previous release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HARDWARE_ENABLED: ${{ vars.KIMINOLA_HARDWARE_CI }}
          REQUESTED_PREVIOUS_TAG: ${{ inputs.previous_tag || vars.KIMINOLA_PREVIOUS_RELEASE_TAG }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:HARDWARE_ENABLED -ne 'true') {
            throw 'Hardware validation is required. Register matching X64 and ARM64 runners, then set KIMINOLA_HARDWARE_CI=true.'
          }
          $tag = $env:REQUESTED_PREVIOUS_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:RELEASE_REPOSITORY/releases/latest" -Headers $headers
            $tag = $release.tag_name
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Previous release tag '$tag' is not vMAJOR.MINOR.PATCH."
          }
          "previous_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  hardware-integration:
    name: Hardware integration ${{ matrix.arch }}
    needs: configuration
    runs-on:
      - self-hosted
      - Windows
      - ${{ matrix.runner_arch }}
      - kiminola-hardware
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner_arch: X64
            target: x86_64-pc-windows-msvc
          - arch: ARM64
            runner_arch: ARM64
            target: aarch64-pc-windows-msvc

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiminola/package-lock.json

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          workspaces: kiminola/src-tauri
          shared-key: hardware-${{ matrix.target }}

      - name: Verify runner and pre-provisioned LLVM architecture
        shell: pwsh
        run: |
          $expectedArchitecture = if ('${{ matrix.target }}' -eq 'aarch64-pc-windows-msvc') { 'Arm64' } else { 'X64' }
          $processArchitecture = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          $osArchitecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($processArchitecture -ne $expectedArchitecture -or $osArchitecture -ne $expectedArchitecture) {
            throw "Runner architecture mismatch: expected $expectedArchitecture, process=$processArchitecture, OS=$osArchitecture."
          }
          $llvmBin = 'C:\Program Files\LLVM\bin'
          $llvmPaths = @(
            (Join-Path $llvmBin 'clang.exe'),
            (Join-Path $llvmBin 'clang-cl.exe'),
            (Join-Path $llvmBin 'libclang.dll')
          )
          ./kiminola/scripts/verify-pe-architecture.ps1 -Target '${{ matrix.target }}' -Paths $llvmPaths
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $llvmPaths[0] --version

      - name: Install frontend dependencies
        working-directory: kiminola
        run: npm.cmd ci --include=dev --no-audit --no-fund

      - name: Prepare native dependencies
        working-directory: kiminola
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-native-deps.ps1 -Target '${{ matrix.target }}' -WriteGithubEnv

      - name: Verify physical microphone captures non-silent audio
        working-directory: kiminola
        shell: pwsh
        run: |
          $tonePath = Join-Path $env:RUNNER_TEMP 'kiminola-microphone-tone.wav'
          $sourceScript = (Resolve-Path './scripts/hardware-audio-source.ps1').Path
          $arguments = "-NoLogo -NoProfile -ExecutionPolicy Bypass -File `"$sourceScript`" -OutputPath `"$tonePath`" -DurationSeconds 30"
          $audioSource = Start-Process powershell.exe -ArgumentList $arguments -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            while (-not (Test-Path -LiteralPath $tonePath) -and [DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 200
            }
            if (-not (Test-Path -LiteralPath $tonePath) -or $audioSource.HasExited) {
              throw 'The physical-microphone stimulus failed to start.'
            }
            Start-Sleep -Seconds 2
            Push-Location 'src-tauri'
            try {
              cargo test --locked --lib --target '${{ matrix.target }}' models::tests::physical_microphone_captures_non_silent_audio -- --ignored --exact
              if ($LASTEXITCODE -ne 0) { throw 'Physical microphone hardware test failed.' }
            } finally {
              Pop-Location
            }
          } finally {
            if (-not $audioSource.HasExited) { Stop-Process -Id $audioSource.Id -Force }
          }

      - name: Verify classic and process loopback capture
        working-directory: kiminola
        shell: pwsh
        run: |
          $tonePath = Join-Path $env:RUNNER_TEMP 'kiminola-hardware-tone.wav'
          $sourceScript = (Resolve-Path './scripts/hardware-audio-source.ps1').Path
          $arguments = "-NoLogo -NoProfile -ExecutionPolicy Bypass -File `"$sourceScript`" -OutputPath `"$tonePath`" -DurationSeconds 180"
          $audioSource = Start-Process powershell.exe -ArgumentList $arguments -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            while (-not (Test-Path -LiteralPath $tonePath) -and [DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 200
            }
            if (-not (Test-Path -LiteralPath $tonePath) -or $audioSource.HasExited) {
              throw 'The hardware audio source failed to start.'
            }
            Start-Sleep -Seconds 2
            Push-Location 'src-tauri'
            try {
              cargo test --locked --lib --target '${{ matrix.target }}' loopback::tests::classic_loopback_captures_non_silent_audio -- --ignored --exact
              if ($LASTEXITCODE -ne 0) { throw 'Classic loopback hardware test failed.' }
              $env:KIMINOLA_TEST_LOOPBACK_PID = [string]$audioSource.Id
              cargo test --locked --lib --target '${{ matrix.target }}' loopback::tests::process_loopback_captures_non_silent_audio -- --ignored --exact
              if ($LASTEXITCODE -ne 0) { throw 'Process loopback hardware test failed.' }
            } finally {
              Pop-Location
              Remove-Item Env:KIMINOLA_TEST_LOOPBACK_PID -ErrorAction SilentlyContinue
            }
          } finally {
            if (-not $audioSource.HasExited) { Stop-Process -Id $audioSource.Id -Force }
          }

      - name: Verify installed ASR model transcribes deterministic speech
        working-directory: kiminola
        shell: pwsh
        run: |
          $modelDir = Join-Path $env:LOCALAPPDATA 'Kiminola\models\nemotron'
          foreach ($file in @('encoder.int8.onnx', 'decoder.int8.onnx', 'joiner.int8.onnx', 'tokens.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $modelDir $file) -PathType Leaf)) {
              throw "Hardware runner model pack is missing $file in $modelDir."
            }
          }
          $speechFixture = Join-Path $env:LOCALAPPDATA 'Kiminola\hardware\speech-test.wav'
          $expectedTranscriptPath = Join-Path $env:LOCALAPPDATA 'Kiminola\hardware\speech-test.txt'
          if (-not (Test-Path -LiteralPath $speechFixture -PathType Leaf)) {
            throw "Hardware runner deterministic speech fixture is missing: $speechFixture."
          }
          if (-not (Test-Path -LiteralPath $expectedTranscriptPath -PathType Leaf)) {
            throw "Hardware runner expected transcript is missing: $expectedTranscriptPath."
          }
          $env:KIMINOLA_TEST_SPEECH_WAV = $speechFixture
          $env:KIMINOLA_REQUIRE_ASR_FIXTURE = '1'
          $env:KIMINOLA_EXPECTED_SPEECH_TEXT = (Get-Content -Raw $expectedTranscriptPath).Trim()
          Push-Location 'src-tauri'
          try {
            cargo test --locked --lib --target '${{ matrix.target }}' asr::tests::session_transcribes_speech_wav -- --exact
            if ($LASTEXITCODE -ne 0) { throw 'ASR model speech transcription test failed.' }
          } finally {
            Pop-Location
            Remove-Item Env:KIMINOLA_TEST_SPEECH_WAV -ErrorAction SilentlyContinue
            Remove-Item Env:KIMINOLA_REQUIRE_ASR_FIXTURE -ErrorAction SilentlyContinue
            Remove-Item Env:KIMINOLA_EXPECTED_SPEECH_TEXT -ErrorAction SilentlyContinue
          }

      - name: Build current unsigned executable
        working-directory: kiminola
        run: |
          npm.cmd run tauri build -- `
            --target '${{ matrix.target }}' `
            --config src-tauri/tauri.ci.conf.json `
            --no-bundle

      - name: Verify current executable and DLL architecture
        working-directory: kiminola
        shell: pwsh
        run: |
          $paths = @(
            'src-tauri/target/${{ matrix.target }}/release/kiminola.exe',
            'src-tauri/target/release/onnxruntime.dll',
            'src-tauri/target/release/onnxruntime_providers_shared.dll',
            'src-tauri/target/release/sherpa-onnx-c-api.dll',
            'src-tauri/target/release/sherpa-onnx-cxx-api.dll'
          )
          ./scripts/verify-pe-architecture.ps1 -Target '${{ matrix.target }}' -Paths $paths

      - name: Bundle the verified current installer
        working-directory: kiminola
        run: |
          npm.cmd run tauri bundle -- `
            --target '${{ matrix.target }}' `
            --config src-tauri/tauri.ci.conf.json `
            --no-sign

      - name: Validate previous-version installation and data preservation
        working-directory: kiminola
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.configuration.outputs.previous_tag }}
          KIMINOLA_HARDWARE_RUNNER: '1'
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/${{ matrix.target }}/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one current installer, found $($installers.Count)." }
          ./scripts/hardware-update-validation.ps1 `
            -PreviousTag $env:PREVIOUS_TAG `
            -Arch '${{ matrix.arch }}'.ToLowerInvariant() `
            -CurrentInstaller $installers[0].FullName `
            -Target '${{ matrix.target }}' `
            -CargoManifestPath 'src-tauri/Cargo.toml'
